<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>YouTube Automation Agent</title>
  <link rel="stylesheet" href="/styles.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23ff0033'/%3E%3Cpath d='M40 32 72 50 40 68Z' fill='white'/%3E%3C/svg%3E" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">▶</span>
      <div>
        <h1>YouTube Automation Agent</h1>
        <p class="sub">7 agents · a production crew, not a replacement for you</p>
      </div>
    </div>
    <div class="status-pills" id="statusPills"></div>
  </header>

  <div class="chain" id="agentChain"></div>

  <div class="layout">
    <nav class="sidenav" id="sidenav">
      <button data-view="pipeline" class="active">Pipeline</button>
      <button data-view="approvals">Approvals <span class="badge" id="navApprovals"></span></button>
      <button data-view="analytics">Analytics</button>
      <button data-view="activity">Activity</button>
      <button data-view="setup">Setup</button>
    </nav>

    <main id="main"></main>
  </div>

  <div class="modal-backdrop" id="modalBackdrop" hidden>
    <div class="modal" id="modal"></div>
  </div>

  <div class="toast-wrap" id="toasts"></div>

  <script src="/app.js"></script>
</body>
</html>
